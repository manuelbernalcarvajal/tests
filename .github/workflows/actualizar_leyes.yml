name: Actualizar leyes del BOE y citas

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-boe:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar BeautifulSoup4
        run: pip install beautifulsoup4

      - name: Descargar y procesar leyes del BOE
        run: python scripts/actualizar_leyes.py

      - name: Indexar referencias cruzadas con apuntes
        run: python scripts/indexar_citas.py

      - name: Guardar cambios en leyes/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leyes/
          if git diff --cached --quiet; then
            echo "Sin cambios en leyes o citas."
          else
            git commit -m "chore: actualizar leyes BOE y referencias cruzadas"
            git push
          fi
