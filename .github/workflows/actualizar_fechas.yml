name: Actualizar fechas de apuntes

on:
  push:
    branches:
      - main
    paths:
      - "apuntes/**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-fechas:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar script de fechas
        run: python scripts/generar_fechas.py

      - name: Guardar cambios si el JS ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apuntes_fechas.js
          if git diff --cached --quiet; then
            echo "Sin cambios en las fechas."
          else
            git commit -m "chore: actualizar fechas de modificación de apuntes"
            git push
          fi
